name: Build macOS App

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15-intel   # Intel Macs (x86_64)
            arch: x86_64
          - runner: macos-latest     # Apple Silicon Macs (arm64)
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests reportlab pillow

      - name: Build macOS application
        run: |
          pyinstaller --windowed --onedir \
            --name IPS-QR ips_qr_gui.py

      - name: Package application
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/IPS-QR.app IPS-QR-macOS-${{ matrix.arch }}.zip

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: IPS-QR-macOS-${{ matrix.arch }}
          path: IPS-QR-macOS-${{ matrix.arch }}.zip
